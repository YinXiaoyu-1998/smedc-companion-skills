name: test

on:
  push:
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r skills/smedc-business-analysis/requirements-dev.txt
      - run: python scripts/validate_all_skills.py
